<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zap Board · Superhive 페이지 비교</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0d0d0f" />
<style>
:root {
  --fw: 726px;                 /* frame width set by the toggle */
  --bg: #0d0d0f; --panel: #17171b; --line: rgba(255,255,255,.12);
  --ink: #f2f2f4; --grey: #a0a0a8; --dim: #6d6d76; --accent: #ffb02e;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --bar-h: 118px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow-x: hidden;
       -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }

.bar { position: sticky; top: 0; z-index: 5; background: rgba(13,13,15,.86);
       backdrop-filter: saturate(160%) blur(18px); -webkit-backdrop-filter: saturate(160%) blur(18px);
       border-bottom: 1px solid var(--line); padding: 16px 20px 14px; }
.bar h1 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.bar h1 span { color: var(--dim); font-weight: 500; }
.controls { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--grey); cursor: pointer;
              font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: -.01em;
              padding: 7px 15px; border-radius: 999px; transition: color .15s ease, background .15s ease; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1c1204; }
.seg button b { font-family: var(--mono); font-weight: 700; }
.note { font-size: 12px; color: var(--dim); }
.note b { color: var(--grey); font-weight: 600; }

.rail { display: flex; gap: 22px; overflow-x: auto; overflow-y: hidden;
        padding: 22px 20px 26px; align-items: flex-start; scroll-snap-type: x proximity;
        height: calc(100vh - var(--bar-h)); }
.col { flex: 0 0 auto; width: var(--fw); max-width: 96vw; scroll-snap-align: start;
       display: flex; flex-direction: column; height: 100%; }
.lab { display: flex; align-items: baseline; gap: 8px; padding: 0 4px 12px; }
.lab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dc, var(--accent)); flex: 0 0 auto; align-self: center; }
.lab .t { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.lab .w { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.frame { flex: 1 1 auto; min-height: 0; border-radius: 16px; overflow: hidden;
         border: 1px solid var(--line); background: #000; box-shadow: 0 24px 60px -34px rgba(0,0,0,.9); }
.frame iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }

/* phone: stack vertically, each frame full width, no horizontal scroll anywhere */
@media (max-width: 760px) {
  :root { --bar-h: auto; }
  .rail { flex-direction: column; overflow-x: hidden; height: auto; padding: 16px; gap: 26px; }
  .col { width: 100% !important; max-width: 100%; height: auto; }
  .frame { height: 78vh; }
  .controls .seg { display: none; }   /* width toggle is desktop-only; phone shows the mobile layout */
  .note.desk { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <h1>Zap Board <span>· Superhive 페이지 비교</span></h1>
  <div class="controls">
    <div class="seg" role="group" aria-label="폭 선택">
      <button data-w="390" aria-pressed="false">폰 <b>390</b></button>
      <button data-w="726" aria-pressed="true">스토어 <b>726</b></button>
      <button data-w="1440" aria-pressed="false">데스크톱 <b>1440</b></button>
    </div>
    <span class="note desk">좌우로 넘겨 비교하고, 각 칸은 안에서 위아래로 스크롤하세요. 폭 버튼으로 폰·스토어·데스크톱을 전환합니다.</span>
    <span class="note" style="display:none" id="mnote">폰 폭 렌더 · 아래로 스크롤</span>
  </div>
</header>

<main class="rail" id="rail">
  <section class="col" style="--dc:#ffb02e">
    <div class="lab"><span class="dot"></span><span class="t">A안 · 에디토리얼 매거진</span><span class="w"></span></div>
    <div class="frame"><iframe src="v-a.html" title="A안 · 에디토리얼 매거진" loading="lazy"></iframe></div>
  </section>
  <section class="col" style="--dc:#ff7a59">
    <div class="lab"><span class="dot"></span><span class="t">B안 · 시네마틱 풀블리드</span><span class="w"></span></div>
    <div class="frame"><iframe src="v-b.html" title="B안 · 시네마틱 풀블리드" loading="lazy"></iframe></div>
  </section>
  <section class="col" style="--dc:#5aa9ff">
    <div class="lab"><span class="dot"></span><span class="t">C안 · 벤토 모자이크</span><span class="w"></span></div>
    <div class="frame"><iframe src="v-c.html" title="C안 · 벤토 모자이크" loading="lazy"></iframe></div>
  </section>
  <section class="col" style="--dc:#ffc828">
    <div class="lab"><span class="dot"></span><span class="t">D안 · 캐러셀 슬라이드</span><span class="w"></span></div>
    <div class="frame"><iframe src="v-d.html" title="D안 · 캐러셀 슬라이드" loading="lazy"></iframe></div>
  </section>
  <section class="col" style="--dc:#7be0a8">
    <div class="lab"><span class="dot"></span><span class="t">E안 · 제품 쇼케이스</span><span class="w"></span></div>
    <div class="frame"><iframe src="v-e.html" title="E안 · 제품 쇼케이스" loading="lazy"></iframe></div>
  </section>
  <section class="col" style="--dc:#8a8a92">
    <div class="lab"><span class="dot"></span><span class="t">기준 · 현재 선호안 (Zap 마케팅)</span><span class="w"></span></div>
    <div class="frame"><iframe src="superhive.html" title="기준 · 현재 선호안 (Zap 마케팅)" loading="lazy"></iframe></div>
  </section>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var seg = document.querySelector('.seg');
    var widths = document.querySelectorAll('.lab .w');
    function setW(w) {
      root.style.setProperty('--fw', w + 'px');
      widths.forEach(function (el) { el.textContent = w + 'px'; });
      seg.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.w === String(w) ? 'true' : 'false');
      });
    }
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; setW(parseInt(b.dataset.w, 10));
    });
    setW(726);
  })();
</script>
</body>
</html>
